<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Shortcut Settings</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/settings.css">
  </head>
  <body>
    <div id="settings-container">
      <h1>Shortcut Settings</h1>

      <!-- Application selector -->
      <div class="toolbar">
        <label for="app-selector">Application:</label>
        <select id="app-selector"></select>

        <button id="add-app-button">Add App...</button>
        <button id="delete-app-button">Delete App</button>
      </div>

      <!-- Add app menu (hidden by default) -->
      <div id="add-app-menu" class="hidden">
        <h3>Add Application</h3>
        <p>Select a running application to add shortcuts for:</p>
        <div id="running-apps-list"></div>
        <button id="cancel-add-button">Cancel</button>
      </div>

      <!-- Shortcuts table -->
      <div class="table-container">
        <table id="shortcuts-table">
          <thead>
            <tr>
              <th>Description</th>
              <th>Keys</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="shortcuts-tbody">
            <!-- Rows will be added dynamically -->
          </tbody>
        </table>

        <button id="add-shortcut-button">Add Shortcut</button>
      </div>

      <!-- Action buttons -->
      <div class="button-bar">
        <button id="save-button" class="primary">Save and Close</button>
        <button id="cancel-button">Cancel</button>
      </div>
    </div>

    <!-- Neutralino.js client -->
    <script src="/js/neutralino.js"></script>

    <!-- Shared modules -->
    <script src="/js/shared/constants.js"></script>
    <script src="/js/shared/utils.js"></script>
    <script src="/js/data/storage.js"></script>
    <script src="/js/platform/window-detection.js"></script>

    <!-- Settings modules -->
    <script src="/js/settings/table.js"></script>
    <script src="/js/settings/app-manager.js"></script>
    <script src="/js/settings/save-handler.js"></script>
    <script src="/js/settings/main.js"></script>
  </body>
</html>
