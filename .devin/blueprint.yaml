initialize: |
  python3 -m venv venv && venv/bin/pip install -r requirements.txt -r requirements-dev.txt
maintenance: |
  venv/bin/pip install -r requirements.txt -r requirements-dev.txt
knowledge:
  - name: test
    contents: |
      venv/bin/python -m pytest tests/ -v
  - name: run
    contents: |
      venv/bin/python main.py
